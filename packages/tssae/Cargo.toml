[package]
name = "tssae-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tssae-common = { path = "crates/tssae-common" }
tssae-analysis = { path = "crates/tssae-analysis" }
tssae-tsrs-boundary = { path = "crates/tssae-tsrs-boundary" }
tssae-adapter-api = { path = "../adapter-api" }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsrs_api = "=7.1.0-beta.tsrs4"
tsrs_ast = "=7.1.0-beta.tsrs4"
tsrs_binder = "=7.1.0-beta.tsrs4"
tsrs_checker = "=7.1.0-beta.tsrs4"
tsrs_compiler = "=7.1.0-beta.tsrs4"
tsrs_core = "=7.1.0-beta.tsrs4"
tsrs_diagnostics = "=7.1.0-beta.tsrs4"
tsrs_module = "=7.1.0-beta.tsrs4"
tsrs_parser = "=7.1.0-beta.tsrs4"
tsrs_project = "=7.1.0-beta.tsrs4"
tsrs_scanner = "=7.1.0-beta.tsrs4"
tsrs_vfs = "=7.1.0-beta.tsrs4"

[lints]
workspace = true

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
