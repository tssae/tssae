name: Publish npm packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  pack:
    name: Check and pack
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: true
      - name: Set up Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source (light)
        run: pnpm run check
      - name: Build packages in dependency order
        run: pnpm exec turbo run build
      - name: Pack unpublished npm versions
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Download packed npm artifacts for verification
        if: steps.pack.outputs.pack-dir-artifact-id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: .changeset/packed
      - name: Verify packed candidates (heavy)
        env:
          TSSAE_ACCEPTANCE_PACK_DIR: ${{ github.workspace }}/.changeset/packed
        run: pnpm run check:heavy

  publish:
    name: Publish npm packages and GitHub Release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish packed npm versions
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
