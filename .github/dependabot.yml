version: 2

updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      drizzle:
        patterns:
          - drizzle-*
          - drizzle-orm
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: pnpm
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mcr.microsoft.com/devcontainers/typescript-node
        update-types:
          - version-update:semver-major
  - package-ecosystem: cargo
    directory: /packages/tssae
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /packages/adapter-api
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /adapters/zod/native
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /adapters/drizzle/native
    schedule:
      interval: weekly
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
