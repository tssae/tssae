[package]
name = "tssae-tsrs-boundary"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
tssae-common = { path = "../tssae-common" }
tssae-analysis = { path = "../tssae-analysis" }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsrs_api = "=7.1.0-beta.tsrs4"
tsrs_ast = "=7.1.0-beta.tsrs4"
tsrs_checker = "=7.1.0-beta.tsrs4"
tsrs_compiler = "=7.1.0-beta.tsrs4"
tsrs_core = "=7.1.0-beta.tsrs4"
tsrs_diagnostics = "=7.1.0-beta.tsrs5"
tsrs_module = "=7.1.0-beta.tsrs4"
tsrs_project = "=7.1.0-beta.tsrs4"
tsrs_scanner = "=7.1.0-beta.tsrs4"
tsrs_sourcemap = "=7.1.0-beta.tsrs4"
tsrs_vfs = "=7.1.0-beta.tsrs4"

[lints]
workspace = true
