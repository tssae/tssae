[package]
name = "tssae-adapter-api"
version = "0.1.0"
edition = "2024"
description = "Stable Rust API and runtime protocol for TSSAE native adapters"
license = "MIT"
repository = "https://github.com/tssae/tssae"
include = ["Cargo.toml", "Cargo.lock", "src/**/*.rs", "tests/**/*.rs"]

[dependencies]
libloading = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["loader"]
loader = ["dep:libloading"]

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[lints]
workspace = true
