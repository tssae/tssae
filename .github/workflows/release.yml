name: Publish npm packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  pack:
    name: Check and pack
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      crate-artifact-id: ${{ steps.upload-crate.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Node version
        id: node-runtime
        run: echo "runtime=node@$(jq -er '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: ${{ steps.node-runtime.outputs.runtime }}
          install: false
          cache: true
      - name: Set up Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source (light)
        run: pnpm run check
      - name: Build packages in dependency order
        run: pnpm exec turbo run build
      - name: Pack unpublished npm versions
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Download packed npm artifacts for verification
        if: steps.pack.outputs.pack-dir-artifact-id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: .changeset/packed
      - name: Pack tssae-adapter-api candidate crate
        id: pack-crate
        run: |
          mkdir -p .changeset/packed-crate
          cargo package --locked --manifest-path packages/adapter-api/Cargo.toml --target-dir target/crate-pack
          crate_file="$(ls target/crate-pack/package/tssae-adapter-api-*.crate)"
          cp "$crate_file" .changeset/packed-crate/
          echo "crate-path=${GITHUB_WORKSPACE}/.changeset/packed-crate/$(basename "$crate_file")" >> "$GITHUB_OUTPUT"
      - name: Upload candidate crate artifact
        id: upload-crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tssae-adapter-api-crate
          path: .changeset/packed-crate/*.crate
      - name: Verify packed candidates (heavy)
        env:
          TSSAE_ACCEPTANCE_PACK_DIR: ${{ github.workspace }}/.changeset/packed
          TSSAE_ACCEPTANCE_CRATE_PATH: ${{ steps.pack-crate.outputs.crate-path }}
        run: pnpm run check:heavy

  publish:
    name: Publish npm packages, crate, and GitHub Release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Node version
        id: node-runtime
        run: echo "runtime=node@$(jq -er '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: ${{ steps.node-runtime.outputs.runtime }}
          install: false
          cache: false
      - name: Set up Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish packed npm versions
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
      - name: Download verified candidate crate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.pack.outputs.crate-artifact-id }}
          path: .changeset/packed-crate
      - name: Publish verified tssae-adapter-api crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          crate_file="$(ls .changeset/packed-crate/tssae-adapter-api-*.crate)"
          mkdir -p .changeset/crate-extract
          tar -xzf "$crate_file" -C .changeset/crate-extract
          cargo publish --locked --manifest-path .changeset/crate-extract/*/Cargo.toml
