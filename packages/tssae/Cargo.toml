[package]
name = "tssae-engine"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
tssae-common = { path = "crates/tssae-common" }
tssae-analysis = { path = "crates/tssae-analysis" }
tssae-tsrs-boundary = { path = "crates/tssae-tsrs-boundary" }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
