[package]
name = "verule-adapter-zod"
version = "0.0.0"
edition = "2024"

[lib]
name = "verule_adapter_zod"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
verule-adapter-api = { version = "0.1.0", path = "../../../packages/adapter-api", default-features = false }

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[lints]
workspace = true

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
