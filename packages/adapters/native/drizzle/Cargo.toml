[package]
name = "tssae-adapter-drizzle"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tssae-adapter-api = { path = "../../../adapter-api", default-features = false }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
