[package]
name = "tssae-adapter-third-party-fixture"
version = "0.1.0"
edition = "2024"

[lib]
name = "tssae_test_adapter"
crate-type = ["cdylib"]

[features]
wrong-abi = []

[dependencies]
tssae-adapter-api = { version = "0.1.0", path = "../../../packages/adapter-api", default-features = false }
serde_json = "1"

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[lints]
workspace = true
